<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — AI Agent Development</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0A0E1A;--card:#121829;--border:#1F2937;
  --text:#E8ECF1;--muted:#94A3B8;--dim:#64748B;--accent:#F5B841;
}
body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  line-height:1.7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
.wrap{max-width:620px;text-align:center}
.code{font-family:'JetBrains Mono',monospace;font-size:.78rem;font-weight:600;letter-spacing:.14em;
  color:var(--accent);background:rgba(245,184,65,.1);border:1px solid rgba(245,184,65,.3);
  border-radius:99px;padding:.35rem 1rem;display:inline-block;margin-bottom:1.5rem}
h1{font-size:2.1rem;font-weight:800;line-height:1.2;margin-bottom:.9rem;letter-spacing:-.02em}
p{color:var(--muted);font-size:1.02rem;margin-bottom:1rem}
p.small{color:var(--dim);font-size:.9rem}
.path{font-family:'JetBrains Mono',monospace;font-size:.85rem;color:var(--text);
  background:var(--card);border:1px solid var(--border);border-radius:8px;
  padding:.65rem 1rem;display:inline-block;margin:.4rem 0 1.6rem;word-break:break-all;max-width:100%}
.cta{display:inline-flex;align-items:center;gap:.5rem;background:var(--accent);color:#0A0E1A;
  text-decoration:none;font-weight:700;font-size:.95rem;border-radius:99px;
  padding:.7rem 1.6rem;transition:opacity 200ms}
.cta:hover{opacity:.86}
.hint{margin-top:2.2rem;padding-top:1.5rem;border-top:1px solid var(--border)}
code{font-family:'JetBrains Mono',monospace;font-size:.85em;background:var(--card);
  border:1px solid var(--border);padding:.12em .45em;border-radius:4px;color:var(--text)}
@media (max-width:560px){h1{font-size:1.6rem}}
</style>
</head>
<body>

<div class="wrap">
  <div class="code">404 · NOT FOUND</div>
  <h1>That page isn't here</h1>
  <p>Nothing is published at</p>
  <div class="path" id="path">this address</div>
  <p><a class="cta" href="/index.html">Browse the course catalog →</a></p>

  <div class="hint">
    <p class="small">Course pages live at <code>/courses/&lt;course&gt;/index.html</code>. If you followed
       a link from an older version of the site, the catalog above lists every course at its current address.</p>
  </div>
</div>

<script>
  // Shown for orientation only — textContent, so the path can't inject markup.
  document.getElementById('path').textContent = location.pathname + location.search;
</script>

</body>
</html>
